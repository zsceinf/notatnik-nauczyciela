<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#184F5A">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Notatnik nauczyciela</title>
<div id="app"><div class="boot-screen"><div class="boot-mark">N</div><div><strong>Notatnik nauczyciela</strong><span>Uruchamianie aplikacji…</span></div></div></div>

<style>
  :root {
    --paper: #F4F7F7;
    --card: #FFFFFF;
    --ink: #14252A;
    --muted: #65777C;
    --line: #D7E2E2;
    --line-soft: #E9EFEF;
    --accent: #184F5A;
    --accent-hover: #123F48;
    --accent-soft: #E5F0F1;
    --accent-2: #4B7D7A;
    --warm: #C8873E;
    --warm-soft: #FBF2E7;
    --ok: #2F6B55;
    --warn: #9A6B25;
    --late: #9A473F;
    --num: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--paper); }
  body { min-height: 100dvh; }
  button, input, textarea, summary { -webkit-tap-highlight-color: transparent; }
  button { touch-action: manipulation; }
  ::selection { background: #D8E9EE; color: var(--ink); }

  #app {
    font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    background: var(--paper);
    min-height: 100%;
    font-size: 15px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 760px; margin: 0 auto; padding: 0 12px 64px; }

  /* --- masthead --- */
  .top {
    position: sticky; top: 0; z-index: 20;
    background: var(--paper);
    padding: 14px 0 0;
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: baseline; gap: 10px; padding: 0 2px 10px; }
  .brand h1 { margin: 0; font-size: 17px; font-weight: 650; letter-spacing: -0.015em; }
  .brand span { font-size: 12px; color: var(--muted); font-family: var(--num); }

  .tabs { display: flex; gap: 2px; }
  .tab {
    flex: 1; padding: 9px 4px; border: 0; background: transparent;
    font: inherit; font-size: 14px; font-weight: 500; color: var(--muted);
    cursor: pointer; border-bottom: 2px solid transparent;
  }
  .tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); font-weight: 620; }
  .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

  .chips { display: flex; gap: 6px; margin: 12px 0 4px; }
  .chip {
    font: inherit; font-size: 13.5px; padding: 7px 12px; cursor: pointer;
    border: 1px solid var(--line); background: var(--card); color: var(--muted);
    border-radius: 20px;
  }
  .chip span { font-family: var(--num); font-size: 11.5px; opacity: .7; margin-left: 2px; }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 560; }
  .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* --- search --- */
  .search {
    width: 100%; margin: 12px 0 10px; padding: 9px 12px;
    border: 1px solid var(--line); border-radius: 7px; background: var(--card);
    font: inherit; font-size: 15px; color: var(--ink);
  }
  .search:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }

  /* --- group rows --- */
  .glist { display: flex; flex-direction: column; gap: 1px; background: var(--line-soft); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .grow {
    display: grid; grid-template-columns: 78px 1fr auto; gap: 10px; align-items: center;
    background: var(--card); border: 0; width: 100%; text-align: left;
    padding: 11px 12px; font: inherit; color: inherit; cursor: pointer;
  }
  .grow:hover { background: #F7FAFB; }
  .grow:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .code { font-family: var(--num); font-size: 13.5px; font-weight: 600; letter-spacing: -0.02em; }
  .gmain { min-width: 0; }
  .gtopic { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .gtopic.empty { color: var(--muted); font-style: italic; }
  .gmeta { font-size: 12px; color: var(--muted); margin-top: 1px; }
  .flag { font-family: var(--num); font-size: 11.5px; padding: 2px 6px; border-radius: 4px; white-space: nowrap; }
  .flag.late { background: #F6E5E2; color: var(--late); }
  .flag.warn { background: #F6EEDC; color: var(--warn); }
  .flag.ok { color: var(--muted); }

  .subhead {
    font-size: 12px; color: var(--muted); font-weight: 600;
    margin: 18px 0 6px 2px; letter-spacing: 0.01em;
  }

  /* --- drift bars --- */
  .prog { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-bottom: 10px; }
  .prog h3 { margin: 0 0 2px; font-size: 15px; font-weight: 620; }
  .prog .cnt { font-size: 12px; color: var(--muted); font-family: var(--num); }
  .bars { margin-top: 10px; display: flex; flex-direction: column; gap: 5px; }
  .bar { display: grid; grid-template-columns: 62px 1fr 30px; gap: 8px; align-items: center; }
  .bar .bcode { font-family: var(--num); font-size: 12px; }
  .track { position: relative; height: 16px; }
  .track::before {
    content: ""; position: absolute; left: 0; right: 0; top: 7.5px;
    height: 1px; background: var(--line);
  }
  .dot {
    position: absolute; top: 4px; width: 9px; height: 9px; border-radius: 50%;
    background: var(--accent); transform: translateX(-4.5px);
  }
  .dot.late { background: var(--late); }
  .bar .bpos { font-family: var(--num); font-size: 12px; color: var(--muted); text-align: right; }
  .median { position: absolute; top: 1px; bottom: 1px; width: 1px; background: var(--muted); opacity: .45; }

  .editlink { border: 0; background: none; font: inherit; font-size: 13px; color: var(--accent); cursor: pointer; padding: 6px 0 0; text-decoration: underline; }

  /* --- sheet --- */
  .scrim { position: fixed; inset: 0; background: rgba(22,33,43,.42); z-index: 40; }
  .sheet {
    position: fixed; z-index: 41; left: 0; right: 0; bottom: 0; top: 24px;
    background: var(--paper); border-radius: 14px 14px 0 0;
    display: flex; flex-direction: column; overflow: hidden;
    box-shadow: 0 -2px 24px rgba(22,33,43,.2);
  }
  @media (min-width: 720px) {
    .sheet { left: 50%; transform: translateX(-50%); width: 700px; top: 40px; bottom: 20px; border-radius: 14px; }
  }
  .shead {
    display: flex; align-items: center; gap: 10px; padding: 12px 14px;
    border-bottom: 1px solid var(--line); background: var(--card);
  }
  .shead h2 { margin: 0; font-size: 16px; font-weight: 650; font-family: var(--num); flex: 1; }
  .shead .sub { font-size: 12px; color: var(--muted); font-family: ui-sans-serif, sans-serif; font-weight: 400; }
  .sbody { flex: 1; overflow-y: auto; padding: 14px; }

  .btn {
    font: inherit; border: 1px solid var(--line); background: var(--card);
    color: var(--ink); border-radius: 7px; padding: 8px 12px; cursor: pointer; font-size: 14px;
  }
  .btn:hover { background: #F7FAFB; }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 560; }
  .btn.primary:hover { background: var(--accent-hover); }
  .btn.primary:disabled { background: var(--line); border-color: var(--line); color: var(--muted); cursor: default; }
  .btn.wide { width: 100%; padding: 12px; text-align: left; }

  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-bottom: 12px; }
  .panel h4 { margin: 0 0 8px; font-size: 13px; font-weight: 620; color: var(--muted); }

  .nowtopic { font-size: 15px; margin-bottom: 10px; }
  .nowtopic .n { font-family: var(--num); color: var(--muted); margin-right: 6px; }
  .nexttopic { font-size: 13px; color: var(--muted); }

  textarea, input[type="text"], input[type="number"], input[type="date"] {
    width: 100%; font: inherit; font-size: 14px; padding: 8px 10px;
    border: 1px solid var(--line); border-radius: 6px; background: #FCFDFE; color: var(--ink);
  }
  textarea:focus, input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  textarea { resize: vertical; min-height: 90px; line-height: 1.5; }

  .row { display: flex; gap: 8px; align-items: center; }
  .row > input { flex: 1; }

  /* --- student grid --- */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); gap: 5px; margin-top: 8px; }
  .cell {
    aspect-ratio: 1; border: 1px solid var(--line); border-radius: 5px; background: var(--card);
    font-family: var(--num); font-size: 13px; cursor: pointer; color: var(--muted); padding: 0;
  }
  .cell[data-s="1"] { background: #DDE7F1; border-color: #A9C1D8; color: var(--accent); font-weight: 600; }
  .cell[data-s="2"] { background: #F6EEDC; border-color: #DCC48A; color: var(--warn); font-weight: 600; }
  .cell[data-s="3"] { background: #DCEBE2; border-color: #9CC4AC; color: var(--ok); font-weight: 600; }
  .cell:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .accs { display: flex; flex-direction: column; gap: 5px; }
  .acc { display:grid; grid-template-columns:76px 1fr; gap:7px; align-items:center; }
  .acc input { padding:7px 9px; font-size:13px; font-family:var(--num); }
  .acc .student-no { text-align:center; font-weight:650; color:var(--accent); background:#F8FBFC; }
  .acc-head { display:grid; grid-template-columns:76px 1fr; gap:7px; margin:3px 0 5px; color:var(--muted); font-size:10.5px; font-weight:650; text-transform:uppercase; letter-spacing:.04em; }
  .acc-head span:first-child { text-align:center; }
  .acc-tools { display:grid; grid-template-columns:1fr auto; gap:7px; margin-bottom:8px; }
  .acc-tools + .acc-tools { margin-top:0; }
  .acc-hint { font-size:11.5px; color:var(--muted); margin:7px 0 10px; }

  .legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 11.5px; color: var(--muted); margin-top: 8px; }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }

  .task { border-top: 1px solid var(--line-soft); padding-top: 10px; margin-top: 10px; }
  .task:first-of-type { border-top: 0; padding-top: 0; margin-top: 0; }
  .thead { display: flex; align-items: baseline; gap: 8px; }
  .thead strong { font-size: 14px; font-weight: 600; }
  .thead .due { font-size: 12px; color: var(--muted); font-family: var(--num); }
  .tally { font-size: 12px; color: var(--muted); font-family: var(--num); margin-top: 4px; }
  .del { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 12px; text-decoration: underline; padding: 0; }

  .note { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 11px 12px; margin-bottom: 8px; }
  .note p { margin: 0; font-size: 14px; white-space: pre-wrap; }
  .note .nm { font-size: 11.5px; color: var(--muted); font-family: var(--num); margin-top: 6px; display: flex; gap: 10px; }

  .empty { color: var(--muted); font-size: 14px; padding: 20px 4px; text-align: center; }
  .empty b { display: block; color: var(--ink); font-weight: 600; margin-bottom: 4px; }

  .foot { margin-top: 26px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
  .foot button { border: 0; background: none; color: var(--late); font: inherit; font-size: 12px; text-decoration: underline; cursor: pointer; padding: 0; }

  .saving { font-size: 11px; color: var(--muted); font-family: var(--num); }


  /* --- online / auth / polish --- */
  .boot-screen {
    min-height: 100dvh; display: flex; align-items: center; justify-content: center; gap: 12px;
    color: var(--ink); font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
    background:linear-gradient(180deg,#F8FAFB 0%,#EEF3F5 100%);
  }
  .boot-screen strong { display:block; font-size:15px; }
  .boot-screen span { display:block; margin-top:2px; color:var(--muted); font-size:12px; }
  .boot-mark, .login-mark {
    display:grid; place-items:center; flex:0 0 auto;
    background:linear-gradient(145deg,#28586C,#4A7D82); color:#fff; font-weight:760;
    box-shadow:0 12px 28px rgba(47,96,115,.20);
  }
  .boot-mark { width:38px; height:38px; border-radius:12px; font-size:18px; }

  .login-page {
    min-height:100dvh; display:grid; place-items:center; padding:28px 16px;
    background:
      radial-gradient(circle at 50% -8%, rgba(84,132,145,.19), transparent 38%),
      radial-gradient(circle at 12% 88%, rgba(184,205,199,.22), transparent 30%),
      linear-gradient(180deg,#F9FBFC 0%,#EDF3F5 100%);
  }
  .login-shell { width:min(400px,100%); }
  .login-brand { display:none; }
  .login-card {
    position:relative; overflow:hidden; background:rgba(255,255,255,.96);
    border:1px solid rgba(202,216,223,.95); border-radius:24px; padding:34px 30px 30px;
    box-shadow:0 24px 70px rgba(30,66,78,.13),0 3px 10px rgba(30,66,78,.04); text-align:center;
  }
  .login-card::before {
    content:""; position:absolute; inset:0 0 auto 0; height:4px;
    background:linear-gradient(90deg,#2F6073,#6C9592);
  }
  .login-card .login-mark { width:52px; height:52px; border-radius:16px; font-size:23px; margin:0 auto 17px; }
  .login-card h1 { margin:0; font-size:25px; line-height:1.16; letter-spacing:-.035em; font-weight:735; }
  .login-card .login-sub { margin:8px 0 25px; color:var(--muted); font-size:13px; line-height:1.5; }
  .login-year { display:inline-block; margin:0 0 18px; padding:5px 9px; border-radius:999px; background:var(--accent-soft); color:var(--accent); font-size:11px; font-family:var(--num); }
  .google-btn {
    width:100%; min-height:50px; display:flex; align-items:center; justify-content:center; gap:11px;
    border:1px solid #C9D8DE; border-radius:13px; background:#fff; color:var(--ink);
    font:inherit; font-size:14px; font-weight:680; cursor:pointer; box-shadow:0 2px 7px rgba(32,63,73,.045);
    transition:transform .12s ease,box-shadow .12s ease,border-color .12s ease,background .12s ease;
  }
  .google-btn:hover { background:#F8FBFC; border-color:#9EB9C3; box-shadow:0 7px 20px rgba(32,63,73,.10); transform:translateY(-1px); }
  .google-btn:active { transform:translateY(0); box-shadow:none; }
  .google-btn:focus-visible { outline:3px solid rgba(47,96,115,.20); outline-offset:2px; }
  .google-g { width:19px; height:19px; display:block; }
  .login-wait { min-height:50px; display:flex; align-items:center; justify-content:center; gap:9px; color:var(--muted); font-size:13px; }
  .spinner { width:17px; height:17px; border:2px solid #D7E2E6; border-top-color:var(--accent); border-radius:50%; animation:spin .75s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .login-error { margin:0 0 17px; padding:10px 12px; border:1px solid #E8C0BA; border-radius:10px; background:#FFF6F4; color:#8C3932; font-size:12px; line-height:1.45; text-align:left; }
  .cloudline { display:flex; flex-wrap:wrap; gap:8px 12px; align-items:center; }
  .cloudok { color:var(--ok); font-weight:650; }
  .clouderr { color:var(--late); font-weight:600; }
  .status-dot { display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--ok); margin-right:6px; vertical-align:1px; box-shadow:0 0 0 3px rgba(46,107,76,.09); }
  .status-dot.offline { background:var(--warn); box-shadow:0 0 0 3px rgba(154,107,18,.09); }

  /* delikatne dopracowanie głównego widoku */
  .wrap { max-width: 860px; padding: 0 16px 72px; }
  .top { padding-top:16px; background:rgba(243,246,248,.94); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); }
  .brand { align-items:center; justify-content:space-between; gap:14px; padding-bottom:11px; }
  .brand-main { min-width:0; }
  .brand h1 { font-size:18px; }
  .brand-meta { display:block; margin-top:2px; color:var(--muted); font-family:var(--num); font-size:11.5px; white-space:nowrap; }
  .top-state { display:flex; align-items:center; gap:9px; color:var(--muted); font-size:11.5px; white-space:nowrap; }
  .top-logout {
    border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:7px;
    padding:6px 9px; font:inherit; font-size:11.5px; font-weight:600; cursor:pointer; text-decoration:none;
  }
  .top-logout:hover { background:var(--accent-soft); border-color:#B7CDD5; color:var(--accent); }
  .top-logout:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .tabs { gap:5px; }
  .tab { border-radius:8px 8px 0 0; }
  .tab:hover { background:rgba(255,255,255,.66); color:var(--ink); }
  .glist, .prog, .panel, .note { box-shadow:0 1px 2px rgba(22,33,43,.025); }
  .grow { min-height:59px; }
  .btn { transition:background .12s ease,border-color .12s ease,transform .12s ease; }
  .btn:active { transform:translateY(1px); }
  .foot {
    margin-top:32px; padding:15px 0 0; border-top:1px solid var(--line); font-size:12px; color:var(--muted);
  }
  .foot-main { display:flex; flex-wrap:wrap; justify-content:space-between; gap:10px 18px; align-items:center; }
  .account-summary { min-width:0; }
  .account-summary .email { margin-left:8px; color:var(--muted); overflow-wrap:anywhere; }
  .save-summary { display:flex; align-items:center; gap:8px; }
  .foot .saving { font-size:11.5px; }
  .moretools { margin-top:11px; }
  .moretools > summary {
    display:inline-flex; align-items:center; gap:6px; cursor:pointer; color:var(--accent); font-size:12px; font-weight:600;
    list-style:none; user-select:none; padding:3px 0;
  }
  .moretools > summary::-webkit-details-marker { display:none; }
  .moretools > summary::after { content:'⌄'; font-size:13px; transition:transform .15s ease; }
  .moretools[open] > summary::after { transform:rotate(180deg); }
  .toolbox { margin-top:10px; padding:12px; border:1px solid var(--line); background:rgba(255,255,255,.72); border-radius:12px; }
  .tool-actions { display:flex; flex-wrap:wrap; gap:7px; }
  .foot .tool-actions .btn, .foot .tool-actions label.btn {
    display:inline-flex; align-items:center; width:auto; border:1px solid var(--line); background:var(--card); color:var(--ink);
    border-radius:7px; padding:7px 10px; text-decoration:none; font:inherit; font-size:12px; cursor:pointer;
  }
  .foot .tool-actions .btn:hover, .foot .tool-actions label.btn:hover { background:#F7F9FB; }
  .danger-zone { margin-top:11px; padding-top:10px; border-top:1px solid var(--line-soft); }
  .foot .danger-link { border:0; background:none; color:var(--late); text-decoration:underline; padding:0; font:inherit; font-size:11.5px; cursor:pointer; }
  .privacy-note { margin-top:8px; font-size:11px; color:var(--muted); }

  @media (max-width:720px) {
    .login-page { padding:18px 12px; }
    .login-card { padding:30px 22px 24px; border-radius:16px; }
    .login-card h1 { font-size:22px; }
    .brand { align-items:flex-start; }
    .top-state { display:flex; }
    .top-state #net-label { display:none; }
    .grow { grid-template-columns:66px 1fr; }
    .grow .flag { grid-column:2; justify-self:start; margin-top:-3px; }
    .row { flex-wrap:wrap; }
    .row > input { min-width:160px; }
    .foot-main { display:block; }
    .save-summary { margin-top:5px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { scroll-behavior:auto !important; transition:none !important; animation-duration:.01ms !important; animation-iteration-count:1 !important; }
  }


  /* --- plan / dzisiaj --- */
  .today-head {
    display:flex; align-items:flex-end; justify-content:space-between; gap:16px;
    margin:18px 2px 10px;
  }
  .today-head h2 { margin:0; font-size:20px; letter-spacing:-.025em; font-weight:720; }
  .today-date { color:var(--muted); font-size:12px; font-family:var(--num); white-space:nowrap; }
  .today-list { display:flex; flex-direction:column; gap:8px; }
  .lesson-card {
    display:grid; grid-template-columns:62px 1fr auto; gap:12px; align-items:center;
    width:100%; padding:12px 13px; border:1px solid var(--line); border-radius:12px;
    background:var(--card); color:var(--ink); text-align:left; font:inherit; cursor:pointer;
    box-shadow:0 1px 2px rgba(30,66,78,.025); transition:border-color .12s ease,box-shadow .12s ease,transform .12s ease;
  }
  .lesson-card:hover { border-color:#A9C2CB; box-shadow:0 5px 16px rgba(30,66,78,.07); transform:translateY(-1px); }
  .lesson-card:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .lesson-card.now { border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft); }
  .lesson-card.next { border-color:#AFC7C1; }
  .lesson-time { font-family:var(--num); color:var(--muted); font-size:11.5px; line-height:1.45; }
  .lesson-time b { display:block; color:var(--ink); font-size:13px; font-weight:680; }
  .lesson-main { min-width:0; }
  .lesson-code { font-family:var(--num); font-size:14px; font-weight:720; }
  .lesson-subj { margin-top:2px; font-size:12.5px; color:var(--muted); }
  .lesson-room { font-family:var(--num); font-size:11.5px; color:var(--muted); padding:4px 7px; border-radius:7px; background:var(--paper); white-space:nowrap; }
  .lesson-badge { display:inline-block; margin-left:7px; padding:2px 6px; border-radius:999px; font-size:10px; font-family:var(--num); vertical-align:1px; }
  .lesson-badge.now { background:var(--accent); color:#fff; }
  .lesson-badge.next { background:#E6F0ED; color:#3A675B; }
  .schedule-details { margin-top:18px; border-top:1px solid var(--line); padding-top:12px; }
  .schedule-details > summary { cursor:pointer; color:var(--accent); font-weight:650; font-size:13px; list-style:none; }
  .schedule-details > summary::-webkit-details-marker { display:none; }
  .week-grid { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:7px; margin-top:11px; }
  .day-card { background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .day-card.today { border-color:var(--accent); }
  .day-title { padding:8px 9px; background:var(--paper); font-size:11px; font-weight:700; }
  .day-card.today .day-title { background:var(--accent-soft); color:var(--accent); }
  .day-row { display:grid; grid-template-columns:24px minmax(0,1fr); column-gap:6px; width:100%; border:0; border-top:1px solid var(--line-soft); background:#fff; padding:8px 9px; text-align:left; cursor:pointer; font:inherit; }
  .day-row:hover { background:#F8FBFC; }
  .day-row .mini-n { grid-row:1 / span 2; align-self:start; font-family:var(--num); color:var(--muted); font-size:10px; padding-top:1px; }
  .day-row .mini-c { min-width:0; font-family:var(--num); font-size:11px; font-weight:650; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .day-row .mini-r { display:block; margin-top:2px; color:var(--muted); font-family:var(--num); font-size:10px; white-space:nowrap; }
  .schedule-empty { padding:26px 10px; text-align:center; color:var(--muted); }
  .schedule-empty b { display:block; color:var(--ink); margin-bottom:4px; }
  .timetable-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; border:1px solid var(--line); border-radius:13px; background:var(--card); }
  .timetable { min-width:900px; display:grid; grid-template-columns:108px repeat(5,minmax(150px,1fr)); }
  .tt-head, .tt-time, .tt-cell { border-right:1px solid var(--line-soft); border-bottom:1px solid var(--line-soft); }
  .tt-head { padding:9px 8px; background:#F3F6F6; font-size:11.5px; font-weight:750; text-align:center; }
  .tt-head.today { background:var(--accent-soft); color:var(--accent); }
  .tt-corner { text-align:left; font-family:var(--num); color:var(--muted); }
  .tt-time { padding:8px 8px; background:#FAFBFB; font-family:var(--num); color:var(--muted); font-size:10px; line-height:1.35; }
  .tt-time b { display:block; color:var(--ink); font-size:11.5px; margin-bottom:2px; }
  .tt-cell { min-height:64px; padding:0; background:#fff; }
  .tt-cell.today { background:#FCFEFE; }
  .tt-cell.empty { background:#FAFBFB; }
  .tt-lesson { width:100%; min-height:63px; display:grid; grid-template-columns:1fr auto; gap:4px 7px; align-content:center; border:0; background:transparent; color:var(--ink); padding:8px 9px; text-align:left; font:inherit; cursor:pointer; }
  .tt-lesson:hover { background:#F4F8F8; }
  .tt-code { font-family:var(--num); font-size:11.5px; font-weight:760; }
  .tt-room { font-family:var(--num); font-size:10px; color:var(--muted); white-space:nowrap; }
  .tt-subj { grid-column:1 / -1; color:var(--muted); font-size:10.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tt-lesson.now { background:#F1F8F4; box-shadow:inset 3px 0 0 var(--ok); }
  .tt-lesson.next { background:#FFF8EF; box-shadow:inset 3px 0 0 var(--warm); }
  @media(max-width:720px){ .timetable { min-width:780px; grid-template-columns:92px repeat(5,minmax(135px,1fr)); } .tt-cell{min-height:58px}.tt-lesson{min-height:57px;padding:7px 8px}.tt-time{font-size:9.5px} }
  @media (max-width:720px) {
    .week-grid { grid-template-columns:1fr; }
    .today-head { align-items:flex-start; flex-direction:column; gap:3px; }
    .lesson-card { grid-template-columns:55px 1fr auto; padding:11px; gap:9px; }
  }


  /* ===== wersja dopracowana ===== */
  body { background:var(--paper); }
  .wrap { max-width:980px; padding:0 18px 80px; }
  .top {
    padding-top:14px; background:rgba(244,247,247,.94);
    border-bottom:1px solid rgba(199,215,215,.9);
    box-shadow:0 6px 24px rgba(28,69,75,.025);
  }
  .brand h1 { font-size:19px; letter-spacing:-.025em; }
  .brand-meta { color:#718287; }
  .tabs { gap:7px; }
  .tab { border-radius:10px 10px 0 0; padding:10px 7px; font-size:13.5px; }
  .tab[aria-selected="true"] { background:rgba(255,255,255,.58); }
  .panel, .prog, .glist, .note, .schedule-details { border-color:var(--line); box-shadow:0 5px 18px rgba(26,63,68,.035); }
  .panel { border-radius:14px; padding:15px; }
  .prog { border-radius:14px; padding:15px; }
  .glist { border-radius:13px; }
  .grow { padding:12px 14px; min-height:64px; }
  .grow:hover { background:#F8FBFB; }
  .chip { border-radius:999px; padding:7px 13px; }
  .search { border-radius:11px; padding:10px 13px; }
  .btn { border-radius:10px; }
  .btn.primary { box-shadow:0 5px 14px rgba(24,79,90,.13); }
  .editlink { text-decoration:none; font-weight:650; }
  .editlink:hover { text-decoration:underline; }

  /* logowanie: mało tekstu, więcej charakteru */
  .login-page {
    position:relative; overflow:hidden;
    background:
      radial-gradient(circle at 18% 18%, rgba(75,125,122,.18), transparent 31%),
      radial-gradient(circle at 84% 82%, rgba(200,135,62,.12), transparent 28%),
      linear-gradient(155deg,#F8FBFB 0%,#EDF4F3 54%,#F6F2EC 100%);
  }
  .login-page::before, .login-page::after { content:""; position:fixed; border-radius:50%; pointer-events:none; }
  .login-page::before { width:280px; height:280px; top:-150px; right:-80px; background:rgba(24,79,90,.055); }
  .login-page::after { width:230px; height:230px; bottom:-130px; left:-70px; background:rgba(200,135,62,.055); }
  .login-shell { width:min(390px,100%); position:relative; z-index:1; }
  .login-card { padding:34px 30px 30px; border-radius:26px; border:1px solid rgba(204,219,218,.92); box-shadow:0 28px 76px rgba(25,66,72,.14),0 2px 7px rgba(25,66,72,.04); }
  .login-card::before { height:5px; background:linear-gradient(90deg,var(--accent),var(--accent-2),var(--warm)); }
  .login-card .login-mark { width:58px; height:58px; border-radius:18px; margin-bottom:18px; background:linear-gradient(145deg,#174C57,#4D7E7A); font-size:25px; box-shadow:0 14px 30px rgba(24,79,90,.23); }
  .login-year { margin-bottom:12px; background:#EEF5F5; font-size:10.5px; letter-spacing:.03em; }
  .login-card h1 { font-size:26px; }
  .login-card .login-sub { margin:7px 0 24px; font-size:12.5px; }
  .google-btn { min-height:53px; border-radius:14px; font-size:14.5px; }

  /* pulpit */
  .dashboard { padding-top:16px; }
  .dash-hero { position:relative; overflow:hidden; display:grid; grid-template-columns:minmax(0,1fr) auto; gap:18px; align-items:center; padding:20px 21px; border:1px solid #CADCDD; border-radius:18px; background:linear-gradient(135deg,#FFFFFF 0%,#F1F7F6 68%,#F8F2EA 100%); box-shadow:0 10px 30px rgba(31,72,77,.055); margin-bottom:14px; }
  .dash-hero::after { content:""; position:absolute; width:170px; height:170px; right:-80px; top:-90px; border-radius:50%; background:rgba(24,79,90,.045); }
  .dash-date { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.055em; font-weight:680; }
  .dash-title { margin:3px 0 4px; font-size:25px; line-height:1.15; letter-spacing:-.035em; font-weight:745; }
  .dash-clock { position:relative; z-index:1; font-family:var(--num); font-size:22px; font-weight:700; color:var(--accent); }
  .dash-meta { display:flex; flex-wrap:wrap; gap:7px; margin-top:11px; }
  .dash-pill { display:inline-flex; gap:5px; align-items:center; padding:5px 9px; border-radius:999px; background:#fff; border:1px solid var(--line); color:var(--muted); font-size:11.5px; }
  .focus-card { display:grid; grid-template-columns:7px 1fr auto; gap:14px; align-items:center; border:1px solid var(--line); border-radius:16px; background:var(--card); padding:15px 16px; margin-bottom:14px; box-shadow:0 7px 24px rgba(25,63,67,.045); }
  .focus-accent { width:7px; align-self:stretch; border-radius:999px; background:var(--warm); }
  .focus-card.now .focus-accent { background:var(--ok); }
  .focus-label { color:var(--muted); font-size:11px; font-weight:750; letter-spacing:.055em; text-transform:uppercase; }
  .focus-main { margin-top:2px; font-size:19px; font-weight:730; letter-spacing:-.025em; }
  .focus-sub { margin-top:2px; color:var(--muted); font-size:12.5px; }
  .focus-count { font-family:var(--num); color:var(--accent); font-size:12px; margin-top:6px; }
  .focus-open { min-width:105px; }
  .section-title { display:flex; align-items:center; justify-content:space-between; gap:12px; margin:20px 2px 8px; }
  .section-title h3 { margin:0; font-size:13px; letter-spacing:.01em; }
  .quiet-link { border:0; background:none; color:var(--accent); padding:4px 0; font:inherit; font-size:11.5px; font-weight:650; cursor:pointer; }
  .today-list { gap:7px; }
  .lesson-card { border-radius:13px; padding:12px 14px; grid-template-columns:92px minmax(0,1fr) auto; transition:transform .12s ease,box-shadow .12s ease,border-color .12s ease,opacity .12s ease; }
  .lesson-card:hover { transform:translateY(-1px); box-shadow:0 7px 18px rgba(28,68,73,.06); }
  .lesson-card.past { opacity:.58; background:#F7F9F9; }
  .lesson-card.now { border-color:#8FB8A7; background:#F2F8F5; box-shadow:0 0 0 2px rgba(47,107,85,.065); }
  .lesson-card.next { border-color:#E0BC8B; background:#FFF9F1; box-shadow:0 0 0 2px rgba(200,135,62,.055); }
  .lesson-badge.now { background:#E3F1E9; color:var(--ok); }
  .lesson-badge.next { background:var(--warm-soft); color:#8C5A1C; }
  .lesson-room { background:#F3F6F6; border:1px solid var(--line-soft); padding:5px 8px; border-radius:8px; }
  .dashboard-grid { display:grid; grid-template-columns:1.15fr .85fr; gap:14px; margin-top:14px; }
  .dash-mini { border:1px solid var(--line); border-radius:15px; background:var(--card); padding:14px; }
  .dash-mini h4 { margin:0 0 10px; font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
  .deadline-row { display:grid; grid-template-columns:1fr auto; gap:8px; padding:8px 0; border-top:1px solid var(--line-soft); }
  .deadline-row:first-of-type { border-top:0; padding-top:0; }
  .deadline-name { font-size:12.5px; font-weight:620; }
  .deadline-meta { display:block; color:var(--muted); font-size:11px; margin-top:1px; }
  .deadline-date { font-family:var(--num); font-size:11px; color:var(--warn); }
  .recent-note { padding:8px 0; border-top:1px solid var(--line-soft); }
  .recent-note:first-of-type { border-top:0; padding-top:0; }
  .recent-note p { margin:0; font-size:12.5px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .recent-note span { display:block; margin-top:3px; color:var(--muted); font-size:10.5px; }

  /* plan tygodnia / edycja */
  .schedule-details { background:transparent; box-shadow:none; border:0; margin-top:16px; }
  .schedule-details > summary { border:1px solid var(--line); background:#fff; border-radius:12px; padding:10px 12px; }
  .week-grid { margin-top:9px; }
  .day-card { border-radius:12px; }
  .plan-editor { display:flex; flex-direction:column; gap:13px; }
  .plan-day-edit { border:1px solid var(--line); border-radius:14px; background:var(--card); overflow:hidden; }
  .plan-day-edit h4 { margin:0; padding:11px 13px; background:#F5F8F8; border-bottom:1px solid var(--line-soft); font-size:13px; }
  .plan-edit-row { display:grid; grid-template-columns:86px minmax(170px,1fr) 82px; gap:8px; align-items:center; padding:7px 10px; border-top:1px solid var(--line-soft); }
  .plan-edit-row:first-of-type { border-top:0; }
  .plan-edit-time { color:var(--muted); font-family:var(--num); font-size:10.5px; line-height:1.35; }
  .plan-edit-row select, .plan-edit-row input { width:100%; padding:7px 8px; border:1px solid var(--line); border-radius:8px; background:#fff; font:inherit; font-size:12px; color:var(--ink); }
  .plan-editor-actions { position:sticky; bottom:0; display:flex; flex-wrap:wrap; gap:8px; padding:10px 0 2px; background:linear-gradient(180deg,rgba(244,247,247,0),var(--paper) 30%); }

  /* grupa */
  .progress-line { display:grid; grid-template-columns:1fr auto; gap:9px; align-items:center; margin:8px 0 12px; }
  .progress-rail { height:8px; border-radius:999px; background:#E9EFEF; overflow:hidden; }
  .progress-fill { height:100%; border-radius:999px; background:linear-gradient(90deg,var(--accent),var(--accent-2)); }
  .progress-pct { font-family:var(--num); color:var(--muted); font-size:11px; }
  .topic-next { border:1px solid #CCDDDE; background:#F5F9F9; border-radius:11px; padding:11px 12px; margin-bottom:10px; }
  .topic-next .kicker { display:block; color:var(--muted); text-transform:uppercase; letter-spacing:.045em; font-size:10px; font-weight:720; }
  .topic-next strong { display:block; margin-top:3px; font-size:13.5px; line-height:1.4; }
  .accs { gap:4px; }
  .acc { border-radius:8px; padding:3px; }
  .acc:nth-child(even) { background:#F7F9F9; }
  .acc-hint { margin:8px 0 11px; }
  .acc-footer { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px; margin-top:10px; }
  .copy-feedback { color:var(--ok); font-size:11px; min-height:16px; }

  /* rozkłady */
  .program-head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
  .program-head h3 { margin:0; }
  .program-stat { flex:0 0 auto; padding:4px 7px; border:1px solid var(--line); border-radius:999px; color:var(--muted); font-family:var(--num); font-size:10.5px; }
  .program-info { margin-top:7px; }
  .program-info summary { color:var(--muted); cursor:pointer; font-size:11.5px; }
  .program-info .cnt { margin-top:5px; }
  .foot-main { justify-content:flex-start; }
  .account-summary { display:none; }
  .save-summary { color:var(--muted); }
  .moretools { margin-top:8px; }

  @media (max-width:760px) {
    .wrap { padding:0 12px 70px; }
    .brand h1 { font-size:17px; }
    .brand-meta { font-size:10.5px; }
    .tabs { gap:2px; overflow-x:auto; scrollbar-width:none; }
    .tabs::-webkit-scrollbar { display:none; }
    .tab { min-width:72px; padding:10px 5px; }
    .dashboard { padding-top:12px; }
    .dash-hero { grid-template-columns:1fr; gap:7px; padding:17px; }
    .dash-clock { font-size:18px; }
    .focus-card { grid-template-columns:6px 1fr; }
    .focus-open { grid-column:2; justify-self:start; min-width:0; }
    .lesson-card { grid-template-columns:72px 1fr auto; padding:11px; }
    .dashboard-grid { grid-template-columns:1fr; }
    .plan-edit-row { grid-template-columns:70px 1fr 68px; gap:6px; padding:7px; }
    .plan-edit-time { font-size:9.5px; }
    .sheet { top:12px; }
  }



  /* ===== RESPONSIVE: DESKTOP / TABLET / MOBILE ===== */
  .table-scroll-hint { display:none; margin:8px 2px 6px; color:var(--muted); font-size:11px; }

  /* wspólne usprawnienia */
  .timetable-wrap { position:relative; scrollbar-gutter:stable; overscroll-behavior-x:contain; }
  .tt-head { position:sticky; top:0; z-index:3; }
  .tt-corner { position:sticky; left:0; z-index:5; }
  .tt-time { position:sticky; left:0; z-index:2; box-shadow:1px 0 0 var(--line-soft); }
  .shead { flex:0 0 auto; position:sticky; top:0; z-index:3; }
  .sbody { overscroll-behavior:contain; }
  .lesson-main, .gmain { min-width:0; }
  .deadline-row { color:inherit; font:inherit; }

  /* DESKTOP: 1180 px i więcej */
  @media (min-width:1180px) {
    .wrap { max-width:1180px; padding-left:22px; padding-right:22px; }
    .top { padding-top:16px; }
    .brand h1 { font-size:20px; }
    .dashboard { padding-top:18px; }
    .dash-hero { padding:22px 24px; }
    .dash-title { font-size:28px; }
    .dash-clock { font-size:24px; }
    .dashboard-grid { grid-template-columns:1.3fr .7fr; gap:16px; }
    .lesson-card { grid-template-columns:112px minmax(0,1fr) 78px; min-height:68px; }
    .timetable { min-width:0; width:100%; grid-template-columns:112px repeat(5,minmax(0,1fr)); }
    .tt-cell { min-height:68px; }
    .tt-lesson { min-height:67px; padding:9px 10px; }
    .tt-code { font-size:12px; }
    .tt-subj { font-size:11px; }
    .tt-room { font-size:10.5px; }
    .sheet { width:min(980px,calc(100vw - 64px)); left:50%; right:auto; transform:translateX(-50%); top:34px; bottom:28px; border-radius:16px; }
    .sbody { padding:18px; }
    .plan-editor { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); align-items:start; gap:14px; }
    .plan-day-edit:last-child { grid-column:1 / -1; }
    .plan-edit-row { grid-template-columns:94px minmax(190px,1fr) 90px; }
    .grid { grid-template-columns:repeat(auto-fill,minmax(42px,1fr)); }
  }

  /* TABLET: 768–1179 px */
  @media (min-width:768px) and (max-width:1179px) {
    .wrap { max-width:none; width:100%; padding-left:16px; padding-right:16px; }
    .brand { gap:12px; }
    .brand-meta { white-space:normal; }
    .dashboard-grid { grid-template-columns:1fr 1fr; gap:12px; }
    .lesson-card { grid-template-columns:98px minmax(0,1fr) 72px; }
    .timetable { min-width:940px; grid-template-columns:104px repeat(5,minmax(165px,1fr)); }
    .table-scroll-hint { display:block; }
    .sheet { left:16px; right:16px; top:18px; bottom:18px; width:auto; transform:none; border-radius:16px; }
    .plan-editor { display:grid; grid-template-columns:1fr; }
    .plan-edit-row { grid-template-columns:88px minmax(170px,1fr) 82px; }
    .acc-tools { grid-template-columns:minmax(0,1fr) auto; }
  }

  /* MOBILE: do 767 px */
  @media (max-width:767px) {
    body { overflow-x:hidden; }
    .wrap { width:100%; max-width:none; padding:0 10px 64px; }
    .top { margin:0 -10px; padding:10px 10px 0; }
    .brand { display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:start; gap:6px 10px; padding-bottom:8px; }
    .brand h1 { font-size:16px; line-height:1.2; }
    .brand-meta { font-size:9.5px; white-space:normal; line-height:1.35; }
    .top-state { align-self:start; gap:6px; }
    .top-logout { padding:6px 8px; font-size:11px; }
    .tabs { margin:0 -2px; gap:2px; overflow-x:auto; scrollbar-width:none; }
    .tabs::-webkit-scrollbar { display:none; }
    .tab { flex:0 0 auto; min-width:78px; padding:9px 8px; font-size:12.5px; }

    .dashboard { padding-top:10px; }
    .dash-hero { grid-template-columns:1fr auto; gap:8px; padding:14px; border-radius:14px; }
    .dash-date { font-size:10px; }
    .dash-title { font-size:22px; }
    .dash-clock { font-size:17px; align-self:start; }
    .dash-meta { gap:5px; margin-top:8px; }
    .dash-pill { padding:4px 7px; font-size:10px; }

    .focus-card { grid-template-columns:5px minmax(0,1fr); gap:10px; padding:12px; border-radius:13px; }
    .focus-main { font-size:17px; }
    .focus-sub { font-size:11.5px; line-height:1.45; }
    .focus-count { font-size:11px; }
    .focus-open { grid-column:2; width:100%; min-width:0; text-align:center; }

    .section-title { margin-top:16px; }
    .lesson-card { grid-template-columns:70px minmax(0,1fr); gap:8px; padding:10px; border-radius:11px; }
    .lesson-time { font-size:10px; }
    .lesson-time b { font-size:11.5px; }
    .lesson-code { font-size:13px; }
    .lesson-subj { font-size:11.5px; }
    .lesson-room { grid-column:2; justify-self:start; font-size:10.5px; padding:3px 6px; }
    .lesson-badge { margin-left:5px; font-size:9px; }

    .dashboard-grid { grid-template-columns:1fr; gap:10px; }
    .dash-mini { padding:12px; border-radius:12px; }
    .deadline-row { grid-template-columns:minmax(0,1fr) auto; }

    .schedule-details { margin-top:12px; }

  function clonePlan(plan) { return JSON.parse(JSON.stringify(plan || {})); }

  function scheduleSubject(code) { var g=group(code); if(!g) return ''; var p=prog(g.prog); return p && p.subj==='eo' ? 'Edukacja obywatelska' : 'Informatyka'; }
  function defaultRoom(code) { var g=group(code), p=g?prog(g.prog):null; var rooms=db&&db.config&&db.config.defaultRooms?db.config.defaultRooms:{}; return p&&p.subj==='inf' ? String(rooms.inf||'') : String(rooms.eo||''); }
  function normalizeSchedule(plan) { var out={}; [1,2,3,4,5].forEach(function(d){ out[d]=(plan&&plan[d]?plan[d]:[]).map(function(it){ return {n:+it.n,label:it.label||displayScheduleLabel(it.group),group:it.group||'',subj:it.subj||scheduleSubject(it.group),room:String(it.room||'')}; }).filter(function(it){return it.n>=1&&it.n<=8&&it.group;}).sort(function(a,b){return a.n-b.n;}); }); return out; }

  function appMetaText() {

  function emptyDb() {

  var db = emptyDb();

  // ---------- zapis online (Firebase) ----------
  // Każdy użytkownik zapisuje wyłącznie we własnej ścieżce:
  // users/{uid}/data/notatnik. Reguły Firestore muszą to egzekwować.
  var timer = null;

  function stripPasswords(d) {
    // Wersja online celowo NIE zapisuje haseł uczniów/stanowisk do chmury.
    // Zachowujemy loginy i pozostałe dane organizacyjne.
    if (!d || !d.groups) return d;
    d.groups.forEach(function (g) {
      if (!g.acc) return;
      Object.keys(g.acc).forEach(function (n) {
        if (g.acc[n] && Object.prototype.hasOwnProperty.call(g.acc[n], 'p')) delete g.acc[n].p;
      });
    });
    return d;
  }

  function safeClone(d) {
    return stripPasswords(JSON.parse(JSON.stringify(d)));
  }

  function localKey() {
    return KEY + (currentUser ? ':' + currentUser.uid : ':anonymous');
  }

  function readLocalRecord() {
    try {
      var raw = window.localStorage.getItem(localKey());
      if (!raw) return null;
      var x = JSON.parse(raw);
      // v4: opakowanie z czasem zapisu; obsługa prostego obiektu na wypadek starszej wersji.
      if (x && x.payload && x.payload.groups) return x;
      if (x && x.groups) return { payload: x, updatedAt: 0 };
    } catch (e) {}
    return null;
  }

  function localSet(d, stamp) {
    try {
      window.localStorage.setItem(localKey(), JSON.stringify({
        payload: safeClone(d),
        updatedAt: stamp || Date.now()
      }));
    } catch (e) {}
  }

  function cloudPayload() {
    return JSON.stringify(safeClone(db));
  }

  function setStatus(text) {
    status = text;
    paintStatus();
  }

  function save() {
    clearTimeout(timer);
    var stamp = Date.now();
    setStatus(navigator.onLine === false ? 'offline — zapisano lokalnie' : 'zapisywanie…');
    localSet(db, stamp); // natychmiastowa kopia awaryjna na tym komputerze
    if (!stateRef || !currentUser || navigator.onLine === false) return;

    timer = setTimeout(function () {
      stateRef.set({
        payload: cloudPayload(),
        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
        clientUpdatedAt: stamp,
        version: 7
      }, { merge: true }).then(function () {
        var t = new Date();
        setStatus('zapisano online ' + String(t.getHours()).padStart(2, '0') + ':' + String(t.getMinutes()).padStart(2, '0'));
      }).catch(function (e) {
        console.error(e);
        setStatus('nie zapisano online — kopia lokalna jest zachowana');
      });
    }, 250);
  }

  function paintStatus() {
    var el = document.getElementById('save-status');
    if (el) el.textContent = status;
    var dot = document.getElementById('net-dot');
    if (dot) dot.className = 'status-dot' + (navigator.onLine === false ? ' offline' : '');
    var net = document.getElementById('net-label');
    if (net) net.textContent = navigator.onLine === false ? 'Offline' : 'Online';
  }

  function migrate() {
    db.groups = Array.isArray(db.groups) ? db.groups : [];
    db.topics = db.topics && typeof db.topics === 'object' ? db.topics : {};
    db.notes = Array.isArray(db.notes) ? db.notes : [];
    applyConfig();
    db.schedule = normalizeSchedule(db.schedule || {});
    db.v = 7;
    stripPasswords(db);
  }

  function useLocalIfAvailable(message) {
    var rec = readLocalRecord();
    if (rec && rec.payload && hasCloudConfig(rec.payload)) {
      db = rec.payload; migrate();
      status = message || 'tryb offline — wczytano kopię lokalną';
      render();
      return true;
    }
    return false;
  }

  function renderSetupRequired() {
    document.getElementById('app').innerHTML =
      '<main class="login-page"><div class="login-shell"><section class="login-card" aria-label="Konfiguracja notatnika">' +
      '<div class="login-mark">N</div><h1>Notatnik nauczyciela</h1>' +
      '<p class="login-sub">Brakuje prywatnej konfiguracji w Firestore. Najpierw uruchom jednorazową migrację konfiguracji.</p>' +
      '<button class="google-btn" id="logout"><span>Wyloguj</span></button>' +
      '</section></div></main>';
  }

  function loadCloud() {
    status = 'wczytywanie danych…';
    stateRef = fs.collection('users').doc(currentUser.uid).collection('data').doc('notatnik');
    var localRec = readLocalRecord();

    return stateRef.get().then(function (snap) {
      var data = snap.exists ? snap.data() : null;
      var cloudStamp = data && data.clientUpdatedAt ? Number(data.clientUpdatedAt) : 0;
      var cloudDb = null;
      if (data && data.payload) {
        try { cloudDb = JSON.parse(data.payload); } catch (e) { cloudDb = null; }
      }

      // Po przejściu na prywatną konfigurację nigdy nie nadpisuj chmury
      // starszą lokalną kopią, która tej konfiguracji jeszcze nie posiada.
      if (localRec && localRec.payload && hasCloudConfig(localRec.payload) &&
          localRec.updatedAt > cloudStamp && hasCloudConfig(cloudDb)) {
        db = localRec.payload; migrate();
        status = 'znaleziono nowszy zapis lokalny — synchronizuję…';
        render(); save(); return;
      }

      if (hasCloudConfig(cloudDb)) {
        db = cloudDb; migrate(); localSet(db, cloudStamp || Date.now());
        status = 'wczytano z chmury';
        render(); return;
      }

      // Stare dane mogą istnieć, ale finalny publiczny index celowo nie zawiera
      // konfiguracji potrzebnej do ich samodzielnego uzupełnienia.
      if (cloudDb && cloudDb.groups) {
        db = cloudDb;
        renderSetupRequired();
        return;
      }

      renderSetupRequired();
    }).catch(function (e) {
      console.error(e);
      if (e && (e.code === 'permission-denied' || e.code === 'firestore/permission-denied')) {
        authError = 'To konto nie ma dostępu do notatnika.';
        currentUser = null; stateRef = null;
        return auth.signOut().finally(function () { renderLogin(false); });
      }
      if (!useLocalIfAvailable('tryb offline — pracujesz na kopii lokalnej')) {
        status = 'nie udało się odczytać danych z chmury';
        renderLogin(false);
      }
    });
  }

  function googleIcon() {
    return '<svg class="google-g" viewBox="0 0 18 18" aria-hidden="true"><path fill="#4285F4" d="M17.64 9.205c0-.638-.057-1.252-.164-1.841H9v3.482h4.844a4.14 4.14 0 0 1-1.797 2.715v2.258h2.909c1.703-1.568 2.684-3.878 2.684-6.614z"/><path fill="#34A853" d="M9 18c2.43 0 4.468-.806 5.956-2.181l-2.909-2.258c-.806.54-1.836.859-3.047.859-2.344 0-4.328-1.585-5.037-3.714H.956v2.332A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.963 10.706A5.41 5.41 0 0 1 3.682 9c0-.592.102-1.167.281-1.706V4.962H.956A9 9 0 0 0 0 9c0 1.452.347 2.826.956 4.038l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.322 0 2.508.455 3.441 1.346l2.581-2.581C13.464.892 11.426 0 9 0A9 9 0 0 0 .956 4.962l3.007 2.332C4.672 5.165 6.656 3.58 9 3.58z"/></svg>';
  }

  function renderLogin(waiting) {
    var error = authError ? '<div class="login-error" role="alert">' + esc(authError) + '</div>' : '';
    var action = waiting
      ? '<div class="login-wait" role="status"><span class="spinner"></span><span>Sprawdzam sesję…</span></div>'
      : '<button class="google-btn" id="login-google">' + googleIcon() + '<span>Zaloguj się przez Google</span></button>';

    document.getElementById('app').innerHTML =
      '<main class="login-page"><div class="login-shell">' +
        '<section class="login-card" aria-label="Logowanie do notatnika">' +
          '<div class="login-mark">N</div>' +
          '<h1>Notatnik nauczyciela</h1>' +
          '<p class="login-sub">Gotowy na dzisiejsze lekcje?</p>' +
          error + action +
        '</section>' +
      '</div></main>';
  }

  function signIn() {
    authError = '';
    var provider = new firebase.auth.GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });
    auth.signInWithPopup(provider).catch(function (e) {
      console.error(e);
      if (e.code === 'auth/unauthorized-domain') {
        authError = 'Ta domena nie jest dodana do dozwolonych domen Firebase Authentication.';
      } else if (e.code === 'auth/popup-blocked') {
        authError = 'Przeglądarka zablokowała okno logowania. Zezwól na wyskakujące okna dla tej strony i spróbuj ponownie.';
      } else if (e.code === 'auth/network-request-failed') {
        authError = 'Brak połączenia z internetem. Sprawdź sieć i spróbuj ponownie.';
      } else if (e.code === 'auth/popup-closed-by-user' || e.code === 'auth/cancelled-popup-request') {
        authError = '';
      } else {
        authError = 'Nie udało się zalogować przez Google. Spróbuj ponownie za chwilę.';
      }
      renderLogin(false);
    });
  }

  function start() {
    renderLogin(true);
    auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(function () {});
    auth.onAuthStateChanged(function (u) {
      if (!u) {

      currentUser = u;
      authError = '';

  // ---------- helpers ----------
  function prog(id) {
    for (var i = 0; i < PROGRAMS.length; i++) if (PROGRAMS[i].id === id) return PROGRAMS[i];
    return null;
  }
  function group(code) {
    for (var i = 0; i < db.groups.length; i++) if (db.groups[i].code === code) return db.groups[i];
    return null;
  }
  function topicsOf(id) { return db.topics[id] || []; }
  function numbersOf(g) {
    if (Array.isArray(g.nums) && g.nums.length) return g.nums.map(function (x) { return String(x); });
    var out = [];
    for (var i = 1; i <= g.count; i++) out.push(String(i));
    return out;
  }
  function parseStudentNumbers(raw) {
    var out = [], seen = {};
    String(raw || '').split(/[;,\s]+/).filter(Boolean).forEach(function (part) {
      var m = part.match(/^(\d+)\-(\d+)$/);
      if (m) {
        var a = +m[1], b = +m[2], step = a <= b ? 1 : -1;
        for (var n = a; ; n += step) {
          if (n > 0 && n <= 99 && !seen[n]) { seen[n] = true; out.push(String(n)); }
          if (n === b) break;
        }
      } else if (/^\d+$/.test(part)) {
        var v = +part;
        if (v > 0 && v <= 99 && !seen[v]) { seen[v] = true; out.push(String(v)); }
      }
    });
    return out;
  }
  function applyStudentNumbers(g, nums) {
    var oldNums = numbersOf(g);
    var oldAcc = g.acc || {};
    var oldAccByNum = {};
    oldNums.forEach(function (num, i) { oldAccByNum[num] = oldAcc[i + 1] || {}; });

    var newAcc = {};
    nums.forEach(function (num, i) { newAcc[i + 1] = oldAccByNum[num] || {}; });

    (g.tasks || []).forEach(function (task) {
      var oldState = task.s || {}, newState = {};
      nums.forEach(function (num, i) {
        var oldIndex = oldNums.indexOf(num);
        if (oldIndex >= 0 && oldState[oldIndex + 1] !== undefined) newState[i + 1] = oldState[oldIndex + 1];
      });
      task.s = newState;
    });

    g.nums = nums.slice();
    g.count = nums.length;
    g.acc = newAcc;
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function today() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function dateFromYmd(s) {
    var p = String(s || '').split('-');
    return p.length === 3 ? new Date(+p[0], +p[1] - 1, +p[2]) : null;
  }
  function daysSince(d) {
    if (!d) return null;
    var then = dateFromYmd(d), now = dateFromYmd(today());
    if (!then || !now) return null;
    return Math.floor((now - then) / 86400000);
  }
  function median(arr) {
    if (!arr.length) return 0;
    var s = arr.slice().sort(function (a, b) { return a - b; });
    var m = Math.floor(s.length / 2);
    return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
  }
  // Grupy z 2 godz./tydz. z założenia idą szybciej, więc porównujemy
  // je tylko między sobą, a nie z grupami jednogodzinnymi.
  function medianFor(pid, hours) {
    return median(db.groups.filter(function (g) {
      return g.prog === pid && g.h === hours;
    }).map(function (g) { return g.idx; }));
  }
  function currentTopic(g) {
    var t = topicsOf(g.prog);
    return g.idx > 0 && t[g.idx - 1] ? t[g.idx - 1] : null;
  }
  function nextTopic(g) {
    var t = topicsOf(g.prog);
    return t[g.idx] || null;
  }

  // ---------- views ----------
  function chips() {
    var n = { inf: 0, eo: 0 };
    db.groups.forEach(function (g) { n[prog(g.prog).subj]++; });
    return '<div class="chips">' +
      [['inf', 'Informatyka'], ['eo', 'Edukacja obywatelska']].map(function (c) {
        return '<button class="chip" aria-pressed="' + (subj === c[0]) + '" data-subj="' + c[0] + '">' +
               c[1] + ' <span>' + n[c[0]] + '</span></button>';
      }).join('') + '</div>';
  }


  function localMinutes() {
    var d = new Date();
    return d.getHours() * 60 + d.getMinutes();
  }
  function hmMinutes(s) {
    var p = String(s).split(':');
    return (+p[0]) * 60 + (+p[1]);
  }
  function polishDate(d) {
    var months = ['stycznia','lutego','marca','kwietnia','maja','czerwca','lipca','sierpnia','września','października','listopada','grudnia'];
    return d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear();
  }
  function lessonState(item, dow, nowMin) {
    if ((new Date()).getDay() !== dow) return '';
    var t = LESSON_TIMES[item.n - 1];
    var a = hmMinutes(t[0]), b = hmMinutes(t[1]);
    if (nowMin >= a && nowMin <= b) return 'now';
    if (nowMin > b) return 'past';
    return 'future';
  }
  function nextLesson(items, dow, nowMin) {
    if ((new Date()).getDay() !== dow) return null;
    for (var i=0;i<items.length;i++) {
      var t=LESSON_TIMES[items[i].n-1];
      if (nowMin < hmMinutes(t[0])) return items[i];
    }
    return null;
  }
  function currentLesson(items, dow, nowMin) {
    if ((new Date()).getDay() !== dow) return null;
    for (var i=0;i<items.length;i++) if (lessonState(items[i],dow,nowMin)==='now') return items[i];
    return null;
  }
  function lessonCountdown(item, nowMin, current) {
    if (!item) return '';
    var t = LESSON_TIMES[item.n-1];
    var mins = current ? hmMinutes(t[1]) - nowMin : hmMinutes(t[0]) - nowMin;
    if (mins <= 0) return '';
    if (current) return 'do końca ' + mins + ' min';
    if (mins < 60) return 'za ' + mins + ' min';
    var h = Math.floor(mins/60), m=mins%60;
    return 'za ' + h + ' godz.' + (m ? ' ' + m + ' min' : '');
  }
  function timeNow() {
    var d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  }
  function tasksSoon() {
    var out=[], base=new Date(today()+'T00:00:00');
    db.groups.forEach(function(g){
      (g.tasks||[]).forEach(function(task){
        if(!task.due) return;
        var dd=new Date(task.due+'T00:00:00');
        var diff=Math.round((dd-base)/86400000);
        if(diff < -1 || diff > 14) return;
        var missing=0;
        for(var i=1;i<=g.count;i++) if((task.s[i]||0)!==3) missing++;
        if(missing) out.push({group:g.code,name:task.name,due:task.due,diff:diff,missing:missing});
      });
    });
    out.sort(function(a,b){return a.due.localeCompare(b.due);});
    return out.slice(0,4);
  }
  function recentNotes() { return (db.notes||[]).slice(0,3); }
  function dueLabel(x) {
    if(x.diff===0) return 'dzisiaj';
    if(x.diff===1) return 'jutro';
    if(x.diff<0) return 'po terminie';
    return x.due.slice(5).split('-').reverse().join('.');
  }
  function viewDzisiaj() {

    var dow = now.getDay();

    var nowMin = localMinutes();

    var nxt = nextLesson(items,dow,nowMin);
    var first = items.length ? LESSON_TIMES[items[0].n-1][0] : '';
    var last = items.length ? LESSON_TIMES[items[items.length-1].n-1][1] : '';
    var h = '<div class="dashboard">' +
      '<section class="dash-hero"><div>' +
        '<div class="dash-date">' + esc(DAY_NAMES[dow] || 'Dzisiaj') + ' · ' + esc(polishDate(now)) + '</div>' +
        '<div class="dash-title">Dzisiaj</div>' +
        '<div class="dash-meta">' +
          '<span class="dash-pill">' + items.length + ' lekcji</span>' +
          (items.length ? '<span class="dash-pill">' + esc(first) + '–' + esc(last) + '</span>' : '') +
          '<span class="dash-pill">' + esc(planValidLabel()) + '</span>' +
        '</div></div><div class="dash-clock">' + timeNow() + '</div></section>';

    if (cur || nxt) {
      var focus = cur || nxt, isCur=!!cur, t=LESSON_TIMES[focus.n-1];
      h += '<section class="focus-card' + (isCur?' now':'') + '"><span class="focus-accent"></span><div>' +
        '<div class="focus-label">' + (isCur?'Teraz':'Następna lekcja') + '</div>' +
        '<div class="focus-main">' + esc(focus.label) + '</div>' +
        '<div class="focus-sub">' + esc(focus.subj) + ' · ' + esc(t[0]+'–'+t[1]) + ' · sala ' + esc(focus.room) + '</div>' +
        '<div class="focus-count">' + esc(lessonCountdown(focus,nowMin,isCur)) + '</div></div>' +
        '<button class="btn primary focus-open" data-open="' + esc(focus.group) + '">Otwórz grupę</button></section>';
    } else if (items.length) {
      h += '<section class="focus-card"><span class="focus-accent"></span><div><div class="focus-label">Plan na dziś</div>' +
           '<div class="focus-main">Lekcje zakończone</div><div class="focus-sub">Wszystkie zajęcia z dzisiejszego planu są już za Tobą.</div></div></section>';
    } else {
      h += '<section class="focus-card"><span class="focus-accent"></span><div><div class="focus-label">Dzisiaj</div>' +
           '<div class="focus-main">Bez lekcji</div><div class="focus-sub">Plan obejmuje dni od poniedziałku do piątku.</div></div></section>';
    }

    h += '<div class="section-title"><h3>Plan dnia</h3><button class="quiet-link" id="edit-schedule">Edytuj plan</button></div>';
    if (items.length) {
      h += '<div class="today-list">';
      items.forEach(function (it) {
        var t = LESSON_TIMES[it.n - 1], st=lessonState(it,dow,nowMin), cls='', badge='';
        if(st==='now'){cls=' now';badge='<span class="lesson-badge now">TERAZ</span>';}
        else if(nxt && nxt.n===it.n){cls=' next';badge='<span class="lesson-badge next">NASTĘPNA</span>';}
        else if(st==='past'){cls=' past';}
        h += '<button class="lesson-card' + cls + '" data-open="' + esc(it.group) + '">' +
             '<span class="lesson-time"><b>' + it.n + '. lekcja</b>' + esc(t[0] + '–' + t[1]) + '</span>' +
             '<span class="lesson-main"><span class="lesson-code">' + esc(it.label) + '</span>' + badge +
             '<span class="lesson-subj">' + esc(it.subj) + '</span></span>' +
             '<span class="lesson-room">s. ' + esc(it.room) + '</span></button>';
      });
      h += '</div>';
    } else h += '<div class="panel schedule-empty"><b>Brak zajęć w planie.</b></div>';

    var soon=tasksSoon(), notes=recentNotes();
    h += '<div class="dashboard-grid"><section class="dash-mini"><h4>Najbliższe terminy</h4>';
    if(!soon.length) h += '<div class="nexttopic">Brak zadań z terminem w najbliższych 14 dniach.</div>';
    soon.forEach(function(x){ h += '<button class="deadline-row" data-open="'+esc(x.group)+'" style="width:100%;border:0;background:none;text-align:left;cursor:pointer"><span><span class="deadline-name">'+esc(x.group)+' · '+esc(x.name)+'</span><span class="deadline-meta">do uzupełnienia: '+x.missing+'</span></span><span class="deadline-date">'+esc(dueLabel(x))+'</span></button>'; });
    h += '</section><section class="dash-mini"><h4>Ostatnie notatki</h4>';
    if(!notes.length) h += '<div class="nexttopic">Brak notatek.</div>';
    notes.forEach(function(n){ h += '<div class="recent-note"><p>'+esc(n.text)+'</p><span>'+esc(n.date)+(n.tag?' · '+esc(n.tag):'')+'</span></div>'; });
    h += '</section></div>';

    h += '<details class="schedule-details" id="week-plan-details"' + (weekPlanOpen ? ' open' : '') + '><summary>Plan całego tygodnia</summary>' +
         '<div class="table-scroll-hint">Przesuń w bok, aby zobaczyć cały tydzień.</div>' +
         '<div class="timetable-wrap"><div class="timetable">' +
         '<div class="tt-head tt-corner">Lekcja</div>';
    [1,2,3,4,5].forEach(function(d){ h += '<div class="tt-head' + (dow===d?' today':'') + '">' + esc(DAY_NAMES[d] || '') + '</div>'; });
    for (var ln=1; ln<=8; ln++) {
      var tt=LESSON_TIMES[ln-1] || ['',''];
      h += '<div class="tt-time"><b>'+ln+'. lekcja</b>'+esc(tt[0]+'–'+tt[1])+'</div>';
      [1,2,3,4,5].forEach(function(d){
        var its=plan[d]||[], item=null;
        for(var ii=0;ii<its.length;ii++) if(+its[ii].n===ln){ item=its[ii]; break; }
        if(!item){ h += '<div class="tt-cell empty'+(dow===d?' today':'')+'"></div>'; return; }
        var st=lessonState(item,d,nowMin), cls='';
        if(st==='now') cls=' now'; else if(dow===d && nxt && +nxt.n===ln) cls=' next';
        h += '<div class="tt-cell'+(dow===d?' today':'')+'"><button class="tt-lesson'+cls+'" data-open="'+esc(item.group)+'">' +
             '<span class="tt-code">'+esc(item.label)+'</span><span class="tt-room">s. '+esc(item.room)+'</span>' +
             '<span class="tt-subj">'+esc(item.subj)+'</span></button></div>';
      });
    }
    h += '</div></div></details></div>';
    return h;
  }

  function viewGrupy() {
    var q = query.trim().toLowerCase();
    var list = db.groups.filter(function (g) {
      if (prog(g.prog).subj !== subj) return false;
      if (!q) return true;
      return g.code.toLowerCase().indexOf(q) > -1 || prog(g.prog).name.toLowerCase().indexOf(q) > -1;
    });

    var h = chips() +
      '<input class="search" id="q" placeholder="Szukaj grupy, np. 2D" value="' + esc(query) + '">';

    if (!list.length) {
      h += '<div class="empty"><b>Brak dopasowania</b>Wyczyść wyszukiwanie, żeby zobaczyć wszystkie grupy tego przedmiotu.</div>';
      return h;
    }

    var byProg = {};
    list.forEach(function (g) { (byProg[g.prog] = byProg[g.prog] || []).push(g); });

    PROGRAMS.forEach(function (p) {
      var gs = byProg[p.id];
      if (!gs) return;
      h += '<div class="subhead">' + esc(p.name) + '</div><div class="glist">';
      gs.forEach(function (g) {
        var med = medianFor(p.id, g.h);
        var t = currentTopic(g);
        var d = daysSince(g.last);
        var flag = '<span class="flag ok">—</span>';
        if (g.idx < med - 1) flag = '<span class="flag late">' + Math.round(med - g.idx) + ' tematy w tyle</span>';
        else if (d !== null && d >= 14) flag = '<span class="flag warn">' + d + ' dni</span>';
        else if (d !== null) flag = '<span class="flag ok">' + d + ' dni</span>';

        h += '<button class="grow" data-open="' + esc(g.code) + '">' +
             '<span class="code">' + esc(g.code) + '</span>' +
             '<span class="gmain">' +
               (t ? '<span class="gtopic">' + esc(g.idx + '. ' + t) + '</span>'
                  : '<span class="gtopic empty">nic jeszcze nie zrealizowano</span>') +
               '<span class="gmeta">' + (g.whole ? 'cała klasa' : 'grupa') + ', ' + g.count +
               ' uczniów · ' + g.h + ' godz./tydz.</span>' +
             '</span>' + flag + '</button>';
      });
      h += '</div>';
    });
    return h;
  }

  function viewRozklady() {
