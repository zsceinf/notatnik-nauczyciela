      '<div class="nexttopic" style="margin-bottom:8px">' + esc(p.pn) + '</div>' +
      '<input type="file" id="file" accept=".rtf,.txt,.csv,.tsv,.docx" style="font-size:13px">' +
      '<div class="nexttopic" style="margin-top:8px">RTF, DOCX, TXT lub CSV. Tematy trafią do pola niżej — przejrzyj je przed zapisaniem.</div>' +
      '<div id="fmsg" class="nexttopic" style="margin-top:6px"></div></div>' +

      '<div class="panel"><h4>Tematy, jeden w wierszu</h4>' +
      '<textarea id="topics" style="min-height:280px" placeholder="Wklej rozkład materiału albo wczytaj plik wyżej.">' +
      esc(t.join('\n')) + '</textarea>' +
      '<div class="row" style="margin-top:10px"><button class="btn primary" id="save-topics">Zapisz rozkład</button>' +
      '<button class="btn" id="clean">Uporządkuj wklejone</button></div>' +
      '<div class="nexttopic" style="margin-top:8px">„Uporządkuj" usuwa numerację, nagłówki tabeli i kolumny z godzinami, jeśli wkleiłeś tabelę z Worda.</div>' +
      '</div></div></div>';
  }

  // ---------- import ----------
  var CP1250 = {
    0xB9: 'ą', 0xE6: 'ć', 0xEA: 'ę', 0xB3: 'ł', 0xF1: 'ń', 0xF3: 'ó',
    0x9C: 'ś', 0x9F: 'ź', 0xBF: 'ż', 0xA5: 'Ą', 0xC6: 'Ć', 0xCA: 'Ę',
    0xA3: 'Ł', 0xD1: 'Ń', 0xD3: 'Ó', 0x8C: 'Ś', 0x8F: 'Ź', 0xAF: 'Ż',
    0x93: '„', 0x94: '”', 0x96: '–', 0x97: '—', 0x85: '…'
  };

  function fromRtf(src) {
    var s = src
      .replace(/\{\\\*[^{}]*\}/g, ' ')
      .replace(/\{\\(fonttbl|colortbl|stylesheet|info|listtable|listoverridetable)[\s\S]*?\}\s*\}/gi, ' ')
      .replace(/\\par[d]?\b/g, '\n')
      .replace(/\\line\b/g, '\n')
      .replace(/\\(cell|tab|intbl)\b/g, '\t')
      .replace(/\\row\b/g, '\n')
      .replace(/\\u(-?\d+)\s?\??/g, function (m, n) {
        n = +n; if (n < 0) n += 65536;
        return String.fromCharCode(n);
      })
      .replace(/\\'([0-9a-fA-F]{2})/g, function (m, hx) {
        var b = parseInt(hx, 16);
        return CP1250[b] || (b < 128 ? String.fromCharCode(b) : '');
      })
      .replace(/\\[a-zA-Z]+-?\d*\s?/g, ' ')
      .replace(/[{}]/g, ' ');
    return s;
  }

  var HEADERS = /^(l\.?p\.?|nr|temat(y)?( lekcji)?|liczba godzin|godz(iny)?|liczba|uwagi|wymagania|osiągnięcia|podstawa programowa|termin|miesiąc|numer|razem|semestr|półrocze|treści nauczania|cele)$/i;

  function cleanLines(text) {
    var out = [], prev = '';
    text.split(/\r?\n/).forEach(function (raw) {
      var line = raw.replace(/\u00a0/g, ' ').trim();
      if (!line) return;

      if (line.indexOf('\t') > -1) {                    // wiersz tabeli — bierzemy najdłuższą komórkę
        var cells = line.split('\t').map(function (c) { return c.trim(); })
          .filter(function (c) { return c && !/^\d+([.,]\d+)?$/.test(c); });
        if (!cells.length) return;
        cells.sort(function (a, b) { return b.length - a.length; });
        line = cells[0];
      }

      line = line.replace(/^\d+[.)]\s+/, '').replace(/\s+/g, ' ').trim();
      if (line.length < 4) return;
      if (HEADERS.test(line)) return;
      if (/^[\d\s.,;:\-–—/]+$/.test(line)) return;
      if (line === prev) return;
      prev = line;
      out.push(line);
    });
    return out;
  }

  function loadFile(file) {
    var msg = document.getElementById('fmsg');
    var name = file.name.toLowerCase();

    function put(text) {
      var lines = cleanLines(text);
      if (!lines.length) {
        msg.textContent = 'Nie znalazłem tematów w tym pliku. Otwórz go i skopiuj kolumnę z tematami do pola niżej.';
        return;
      }
      document.getElementById('topics').value = lines.join('\n');
      msg.textContent = 'Wczytano ' + lines.length + ' pozycji. Sprawdź i popraw, potem zapisz.';
    }

    if (name.slice(-5) === '.docx') {
      msg.textContent = 'Wczytywanie pliku Word…';
      var go = function () {
        file.arrayBuffer().then(function (buf) {
          window.mammoth.extractRawText({ arrayBuffer: buf })
            .then(function (r) { put(r.value); })
            .catch(function () { msg.textContent = 'Nie udało się odczytać tego DOCX. Zapisz go jako TXT albo skopiuj tematy ręcznie.'; });
        });
      };
      if (window.mammoth) return go();
      var sc = document.createElement('script');
      sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js';
      sc.onload = go;
      sc.onerror = function () { msg.textContent = 'Brak połączenia z biblioteką do DOCX. Zapisz plik jako TXT albo RTF.'; };
      document.head.appendChild(sc);
      return;
    }

    var fr = new FileReader();
    fr.onload = function () {
      var txt = String(fr.result);
      put(name.slice(-4) === '.rtf' || txt.slice(0, 5) === '{\\rtf' ? fromRtf(txt) : txt);
    };
    fr.onerror = function () { msg.textContent = 'Nie udało się otworzyć pliku.'; };
    fr.readAsText(file, name.slice(-4) === '.rtf' ? 'windows-1250' : 'utf-8');
  }

  // ---------- render ----------
  function render() {
    var body =
      tab === 'dzisiaj' ? viewDzisiaj() :
      tab === 'grupy' ? viewGrupy() :
      tab === 'rozklady' ? viewRozklady() : viewNotatki();

    var net = navigator.onLine === false ? 'Offline' : 'Online';

    document.getElementById('app').innerHTML =
      '<div class="wrap"><div class="top"><div class="brand">' +
        '<div class="brand-main"><h1>Notatnik nauczyciela</h1><span class="brand-meta">' + esc(appMetaText()) + '</span></div>' +
        '<div class="top-state"><span><span id="net-dot" class="status-dot' + (navigator.onLine === false ? ' offline' : '') + '"></span><span id="net-label">' + net + '</span></span><button class="top-logout" id="logout">Wyloguj</button></div>' +
      '</div><div class="tabs" role="tablist">' +
      ['dzisiaj:Dzisiaj', 'grupy:Grupy', 'rozklady:Materiał', 'notatki:Notatki'].map(function (x) {
        var k = x.split(':');
        return '<button class="tab" role="tab" aria-selected="' + (tab === k[0]) + '" data-tab="' + k[0] + '">' + k[1] + '</button>';
      }).join('') + '</div></div>' + body +
      '<footer class="foot">' +
        '<div class="foot-main">' +
          '<div class="save-summary"><span aria-hidden="true">✓</span><span id="save-status" class="saving">' + esc(status) + '</span></div>' +
        '</div>' +
        '<details class="moretools"><summary>Więcej opcji</summary><div class="toolbox">' +
          '<div class="tool-actions">' +
            '<button class="btn" id="export">Kopia zapasowa</button>' +
            '<label class="btn">Przywróć kopię<input type="file" id="import" accept=".json" style="display:none"></label>' +
          '</div>' +
          '<div class="privacy-note">Kopia zapasowa zawiera dane organizacyjne notatnika, ale nie zawiera haseł uczniów.</div>' +
          '<div class="danger-zone"><button class="danger-link" id="reset">Wyczyść dane notatnika…</button></div>' +
        '</div></details>' +
      '</footer></div>' + viewSheet();

    var q = document.getElementById('q');
    if (q && query) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); }

    var weekDetails = document.getElementById('week-plan-details');
    if (weekDetails) {
      weekDetails.addEventListener('toggle', function () {
        weekPlanOpen = weekDetails.open;
      });
    }

    clearTimeout(dashboardTimer);
    if (tab === 'dzisiaj' && !openCode && !editProg && !editSchedule) {
      dashboardTimer = setTimeout(function () { if (tab === 'dzisiaj' && !openCode && !editProg && !editSchedule) render(); }, 30000);
    }
  }

  // ---------- events ----------
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-tab],[data-subj],[data-open],[data-close],[data-prog],[data-task],[data-deltask],[data-delnote],#advance,#back,#add-task,#add-note,#save-topics,#clean,#acc-fill,#nums-apply,#copy-logins,#edit-schedule,#save-schedule,#reset-schedule,#export,#reset,#logout,#login-google');
    if (!el) return;

    if (el.dataset.tab) { tab = el.dataset.tab; query = ''; return render(); }
    if (el.dataset.subj) { subj = el.dataset.subj; query = ''; return render(); }
    if (el.dataset.close) { openCode = null; editProg = null; editSchedule = false; return render(); }
    if (el.dataset.open) { openCode = el.dataset.open; return render(); }
    if (el.dataset.prog) { editProg = el.dataset.prog; return render(); }
    if (el.id === 'edit-schedule') { editSchedule = true; return render(); }
    if (el.id === 'save-schedule') {
      var nextPlan={1:[],2:[],3:[],4:[],5:[]};
      document.querySelectorAll('[data-plan-group]').forEach(function(sel){
        var parts=sel.dataset.planGroup.split('-'), d=+parts[0], n=+parts[1], code=sel.value;
        if(!code) return;
        var roomEl=document.querySelector('[data-plan-room=\"'+d+'-'+n+'\"]');
        var room=roomEl ? roomEl.value.trim() : '';
        nextPlan[d].push({n:n,label:displayScheduleLabel(code),group:code,subj:scheduleSubject(code),room:room || defaultRoom(code)});
      });
      db.schedule=normalizeSchedule(nextPlan); editSchedule=false; save(); return render();
    }
    if (el.id === 'reset-schedule') {
      if(confirm('Przywrócić plan bazowy zapisany w prywatnej konfiguracji?')) { var base=db.config&&db.config.baseSchedule; if(base){ db.schedule=clonePlan(base); save(); return render(); } alert('Brak planu bazowego w konfiguracji.'); }
      return;
    }

    var g = openCode ? group(openCode) : null;

    if (el.id === 'advance' && g) {
      g.idx++; g.last = today(); save(); return render();
    }
    if (el.id === 'back' && g && g.idx > 0) {
      g.idx--; save(); return render();
    }
    if (el.dataset.task !== undefined && g) {
      var task = g.tasks[+el.dataset.task];
      var n = +el.dataset.n;
      task.s[n] = ((task.s[n] || 0) + 1) % 4;
      el.dataset.s = task.s[n];
      save();
      return;
    }
    if (el.dataset.deltask !== undefined && g) {
      g.tasks.splice(+el.dataset.deltask, 1); save(); return render();
    }
    if (el.id === 'add-task' && g) {
      var nm = document.getElementById('task-name').value.trim();
      if (!nm) return;
      g.tasks.unshift({ name: nm, due: document.getElementById('task-due').value, s: {} });
      save(); return render();
    }
    if (el.id === 'add-note') {
      var tx = document.getElementById('new-note').value.trim();
      if (!tx) return;
      db.notes.unshift({ text: tx, tag: document.getElementById('note-tag').value.trim(), date: today() });
      save(); return render();
    }
    if (el.dataset.delnote !== undefined) {
      db.notes.splice(+el.dataset.delnote, 1); save(); return render();
    }
    if (el.id === 'nums-apply' && g) {
      var nums = parseStudentNumbers(document.getElementById('student-numbers').value);
      if (!nums.length) { alert('Wpisz numery uczniów, np. 1-8, 10, 13, 17-20.'); return; }
      if (nums.length > 40) { alert('Maksymalnie 40 uczniów w grupie.'); return; }
      applyStudentNumbers(g, nums);
      save(); return render();
    }
    if (el.id === 'acc-fill' && g) {
      var pat = document.getElementById('acc-pattern').value.trim();
      if (!pat) return;
      g.pattern = pat;
      g.acc = g.acc || {};
      var nums = numbersOf(g);
      for (var s = 1; s <= g.count; s++) {
        g.acc[s] = g.acc[s] || {};
        if (!g.acc[s].l) {
          var journalNo = String(nums[s - 1] || s);
          var padded = journalNo.length < 2 ? '0' + journalNo : journalNo;
          g.acc[s].l = pat.replace(/\{nr2\}/g, padded)
                          .replace(/\{nr\}/g, journalNo);
        }
      }
      save(); return render();
    }
    if (el.id === 'copy-logins' && g) {
      var nums=numbersOf(g), lines=[];
      for(var ci=1;ci<=g.count;ci++){
        var login=(g.acc && g.acc[ci] && g.acc[ci].l) ? g.acc[ci].l : '';
        if(login) lines.push((nums[ci-1]||ci) + '\t' + login);
      }
      var txt=lines.join('\n');
      if(!txt){ alert('Nie ma jeszcze loginów do skopiowania.'); return; }
      var done=function(){ var f=document.getElementById('copy-feedback'); if(f) f.textContent='Skopiowano '+lines.length+' loginów.'; };
      if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done).catch(function(){alert(txt);});
      else { try { var ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); done(); } catch(e){ alert(txt); } }
      return;
    }
    if (el.id === 'clean') {
      var ta = document.getElementById('topics');
      ta.value = cleanLines(ta.value).join('\n');
      return;
    }
    if (el.id === 'clean-noop') { return; }
    if (el.id === 'save-topics') {
      db.topics[editProg] = document.getElementById('topics').value
        .split('\n').map(function (s) { return s.trim(); }).filter(Boolean);
      editProg = null; save(); return render();
    }
    if (el.id === 'login-google') { return signIn(); }
    if (el.id === 'logout') { return auth.signOut(); }
    if (el.id === 'export') {
      var blob = new Blob([JSON.stringify(safeClone(db), null, 1)], { type: 'application/json' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'notatnik-kopia-' + today() + '.json';
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
      return;
    }
    if (el.id === 'reset') {
      var answer = prompt('To usunie postęp lekcji, zadania, notatki i własne zmiany rozkładów z chmury.\n\nAby potwierdzić, wpisz: USUŃ');
      if (answer === 'USUŃ') {
        resetOperationalData(); save(); return render();
      }
    }
  });

  document.addEventListener('input', function (e) {
    if (e.target.dataset && e.target.dataset.acc) {
      var g = openCode ? group(openCode) : null;
      if (!g) return;
      var n = e.target.dataset.n;
      g.acc = g.acc || {};
      g.acc[n] = g.acc[n] || {};
      g.acc[n][e.target.dataset.acc] = e.target.value;
      return save();                       // bez render(), żeby nie wyrzucało kursora z pola
    }
    if (e.target.id === 'q') { query = e.target.value; return render(); }
  });

  document.addEventListener('change', function (e) {
    if (e.target.id === 'import' && e.target.files && e.target.files[0]) {
      var fr = new FileReader();
      fr.onload = function () {
        try {
          var d = JSON.parse(String(fr.result));
          if (!d || !d.groups) throw 0;
          if (!d.config && db.config) d.config = safeClone(db.config);
          if (!d.schedule && db.schedule) d.schedule = clonePlan(db.schedule);
          if (confirm('Przywrócić tę kopię? Obecny stan notatnika online zostanie zastąpiony zawartością pliku.')) {
            db = d; migrate(); save(); render();
          }
        } catch (err) { alert('To nie wygląda na kopię notatnika.'); }
      };
      fr.readAsText(e.target.files[0], 'utf-8');
      return;
    }
    if (e.target.id === 'file' && e.target.files && e.target.files[0]) {
      return loadFile(e.target.files[0]);
    }
    if (e.target.id === 'schedule-import' && e.target.files && e.target.files[0]) {
      var sfr = new FileReader();
      sfr.onload = function () {
        try {
          var x = JSON.parse(String(sfr.result));
          if (!x || !x.schedule || !Array.isArray(x.lessonTimes) || x.lessonTimes.length !== 8) throw 0;
          var np = normalizeSchedule(x.schedule);
          var count = 0; [1,2,3,4,5].forEach(function(d){ count += (np[d]||[]).length; });
          if (!count) throw 0;
          if (confirm('Wczytać ten plan lekcji? Obecny plan zostanie zastąpiony.')) {
            db.schedule = np;
            db.config = db.config || {};
            db.config.baseSchedule = clonePlan(np);
            db.config.lessonTimes = x.lessonTimes.slice();
            db.config.meta = db.config.meta || {};
            if (x.planValidFrom) db.config.meta.planValidFrom = String(x.planValidFrom);
            applyConfig(); editSchedule = false; save(); render();
          }
        } catch (err) { alert('Nie udało się wczytać planu.'); }
      };
      sfr.readAsText(e.target.files[0], 'utf-8');
      return;
    }
    var g = openCode ? group(openCode) : null;
    if (!g) return;
    if (e.target.dataset && e.target.dataset.studentNumber !== undefined) {
      var idx = Math.max(0, (+e.target.dataset.studentNumber || 1) - 1);
      var value = String(e.target.value || '').trim();
      var nums = numbersOf(g);
      if (!/^\d{1,2}$/.test(value) || +value < 1 || +value > 99) {
        alert('Numer w dzienniku powinien być liczbą od 1 do 99.');
        return render();
      }
      for (var i = 0; i < nums.length; i++) {
        if (i !== idx && nums[i] === String(+value)) {
          alert('Ten numer jest już przypisany do innego ucznia.');
          return render();
        }
      }
      nums[idx] = String(+value);
      g.nums = nums;
      save(); return render();
    }
    if (e.target.id === 'gnote') { g.note = e.target.value; save(); }
    if (e.target.id === 'gcount') {
      var v = Math.max(1, Math.min(40, +e.target.value || 16));
      if (Array.isArray(g.nums) && g.nums.length) {
        var nums = numbersOf(g).slice(0, v);
        var used = {};
        nums.forEach(function (x) { used[x] = true; });
        for (var n = 1; nums.length < v; n++) if (!used[String(n)]) { nums.push(String(n)); used[String(n)] = true; }
        applyStudentNumbers(g, nums);
      } else {
        g.count = v;
      }
      save(); render();
    }
  });

  window.addEventListener('online', function () {
    paintStatus();
    if (currentUser && stateRef) {
      status = 'internet wrócił — synchronizuję…';
      save();
    }
  });
  window.addEventListener('offline', function () {
    status = 'offline — zmiany zostaną zachowane lokalnie';
    paintStatus();
  });

  start();
})();
</script>
