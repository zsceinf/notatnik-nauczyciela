<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Notatnik nauczyciela</title>
<style>
:root{--bg:#f3f6f6;--card:#fff;--ink:#14252a;--muted:#65777c;--line:#d7e2e2;--accent:#184f5a;--ok:#2f6b55;--bad:#9a473f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink)}
main{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(410px,100%);background:var(--card);border:1px solid var(--line);border-radius:24px;padding:32px 28px 28px;box-shadow:0 24px 70px rgba(24,79,90,.12)}
h1{font-size:25px;letter-spacing:-.035em;margin:12px 0 7px;text-align:center}
.sub{margin:0 auto 2px;color:var(--muted);font-size:13px;line-height:1.55;text-align:center;max-width:360px}
.mark{width:56px;height:56px;margin:0 auto 14px;display:grid;place-items:center;border-radius:17px;background:linear-gradient(145deg,#174c57,#4d7e7a);color:#fff;font-size:24px;font-weight:760;box-shadow:0 14px 30px rgba(24,79,90,.20)}
.box{margin-top:18px;padding:12px 13px;border:1px solid var(--line);border-radius:12px;background:#f9fbfb;font-size:12.5px;line-height:1.5;text-align:center;color:var(--muted)}
.ok{color:var(--ok);font-weight:700}.bad{color:var(--bad);font-weight:700}
button{width:100%;margin-top:12px;min-height:50px;border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--ink);font:inherit;font-weight:680;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.secondary{background:#fff;color:var(--muted)}
button:disabled{opacity:.5;cursor:default}.hidden{display:none}
</style>
</head>
<body>
<main><section class="card">
<div class="mark">N</div>
<h1>Notatnik nauczyciela</h1>
<p class="sub">Zaloguj się, aby kontynuować.</p>
<div id="status" class="box hidden"></div>
<button id="login" class="primary">Zaloguj się przez Google</button>
<button id="migrate" class="primary hidden">Kontynuuj</button>
<button id="logout" class="secondary hidden">Wyloguj</button>
</section></main>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
(function(){
  var firebaseConfig={
    apiKey:"AIzaSyBKlvvhmYS6E3r2E0QuqiCGgAaKuJOZ-gQ",
    authDomain:"notatnik-nauczyciela.firebaseapp.com",
    projectId:"notatnik-nauczyciela",
    storageBucket:"notatnik-nauczyciela.firebasestorage.app",
    messagingSenderId:"692175722654",
    appId:"1:692175722654:web:4141d3aa6b485ca4b4c38f"
  };
  firebase.initializeApp(firebaseConfig);
  var auth=firebase.auth(), fs=firebase.firestore(), user=null, ref=null, payload=null;
  var status=document.getElementById('status'), login=document.getElementById('login'), migrate=document.getElementById('migrate'), logout=document.getElementById('logout');

  var ORG_EO='Organizacja pracy na lekcjach edukacji obywatelskiej. Prawa i obowiązki ucznia – wstęp do świadomego obywatelstwa';
  var PN_INF='Program nauczania: G. Koba, „Program nauczania. Teraz bajty. Informatyka dla szkoły ponadpodstawowej. Zakres podstawowy. Klasy I–III", Migra';
  var PN_EO='Program nauczania: U. Małek, S. Żmijewska-Kwiręg, „Masz wpływ". Program nauczania edukacji obywatelskiej dla liceum ogólnokształcącego i technikum, Nowa Era';
  var PROGRAMS=[
    {id:'tb1',subj:'inf',name:'Informatyka — klasa 1 LO',book:'Podręcznik: G. Koba, „Teraz bajty" kl. I, Migra · 1042/1/2019',pn:PN_INF},
    {id:'tb1t',subj:'inf',name:'Informatyka — klasa 1 technikum (cykl 2-letni)',book:'Podręczniki: G. Koba, „Teraz bajty" kl. I (1042/1/2019) w I półroczu, kl. II (1042/2/2020) od II półrocza, Migra',pn:PN_INF},
    {id:'tb2',subj:'inf',name:'Informatyka — klasa 2 LO',book:'Podręcznik: G. Koba, „Teraz bajty" kl. II, Migra · 1042/2/2020',pn:PN_INF},
    {id:'tb2t',subj:'inf',name:'Informatyka — klasa 2 technikum (cykl 2-letni)',book:'Podręcznik: G. Koba, „Teraz bajty" kl. III, Migra · 1042/3/2021',pn:PN_INF},
    {id:'tb3',subj:'inf',name:'Informatyka — klasa 3 (LO i technikum)',book:'Podręcznik: G. Koba, „Teraz bajty" kl. III, Migra · 1042/3/2021',pn:PN_INF},
    {id:'eo1',subj:'eo',name:'Edukacja obywatelska — klasa 2',book:'Podręcznik: S. Drelich, R. Flis, M. Tragarz, M. Wojcieszak, S. Żmijewska-Kwiręg, „Masz wpływ" cz. 1, Nowa Era · 1236/1/2025',pn:PN_EO},
    {id:'eo2',subj:'eo',name:'Edukacja obywatelska — klasa 3 LO',book:'Podręcznik: S. Drelich, R. Flis, M. Tragarz, E. Krawczyk, „Masz wpływ" cz. 2, Nowa Era · 1236/2/2026',pn:PN_EO},
    {id:'eo3tb',subj:'eo',name:'Edukacja obywatelska — 3Tb technikum (cz. 1 + cz. 2)',book:'Podręczniki: „Masz wpływ" cz. 1, Nowa Era · 1236/1/2025 oraz „Masz wpływ" cz. 2, Nowa Era · 1236/2/2026',pn:PN_EO}
  ];
  var LESSON_TIMES=[['08:00','08:45'],['08:55','09:40'],['09:50','10:35'],['10:55','11:40'],['11:50','12:35'],['12:45','13:30'],['13:40','14:25'],['14:35','15:20']];
  var DAY_NAMES={1:'Poniedziałek',2:'Wtorek',3:'Środa',4:'Czwartek',5:'Piątek'};

  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function set(html,kind){status.className='box'+(kind?' '+kind:'');status.innerHTML=html;}
  function stripPasswords(d){(d.groups||[]).forEach(function(g){if(!g.acc)return;Object.keys(g.acc).forEach(function(k){if(g.acc[k]&&Object.prototype.hasOwnProperty.call(g.acc[k],'p'))delete g.acc[k].p;});});return d;}
  function isOrg(s){s=String(s||'').toLowerCase();return s.indexOf('lekcja organizacyjna')===0||s.indexOf('organizacja pracy na lekcjach edukacji obywatelskiej')===0;}
  function ensureOrg(d,pid){
    var a=d.topics[pid]; if(!Array.isArray(a)||!a.length) throw new Error('Brak rozkładu '+pid+' w Firestore.');
    if(isOrg(a[0])) a[0]=ORG_EO;
    else { a.unshift(ORG_EO); (d.groups||[]).forEach(function(g){if(g.prog===pid&&g.idx>0)g.idx++;}); }
  }
  function withoutOrg(a){a=(a||[]).slice(); if(a.length&&isOrg(a[0]))a.shift(); return a;}
  function buildMigration(d){
    if(!d||!Array.isArray(d.groups)||!d.topics||!d.schedule) throw new Error('Dokument nie ma oczekiwanej struktury notatnika.');
    ensureOrg(d,'eo1'); ensureOrg(d,'eo2');
    var eo1=withoutOrg(d.topics.eo1), eo2=withoutOrg(d.topics.eo2);
    var start=eo1.findIndex(function(x){return /Wybory demokratyczne/i.test(String(x));});
    if(start<0) throw new Error('Nie znalazłem w części 1 tematu „Wybory demokratyczne”. Nie wykonano żadnego zapisu.');
    d.topics.eo3tb=[ORG_EO].concat(eo1.slice(start)).concat(eo2);

    var g3=null;
    d.groups.forEach(function(g){if(g.code==='3Tb')g3=g;});
    if(!g3) throw new Error('Nie znaleziono grupy EO 3Tb.');
    var oldProg=g3.prog, oldIdx=+g3.idx||0;
    g3.prog='eo3tb'; g3.whole=true; g3.h=1;
    if(oldProg!=='eo3tb' && oldIdx>1){
      g3.migrationBackup={prog:oldProg,idx:oldIdx,last:g3.last||null};
      g3.idx=1; // bezpiecznie zachowujemy tylko zrealizowaną lekcję organizacyjną
    }

    d.config={
      version:1,
      meta:{schoolYear:'2026/2027',hoursPerWeek:28,planValidFrom:'01.09.2026'},
      programs:PROGRAMS,
      lessonTimes:LESSON_TIMES,
      dayNames:DAY_NAMES,
      defaultRooms:{inf:'56a',eo:''},
      baseSchedule:JSON.parse(JSON.stringify(d.schedule))
    };
    d.v=7;
    stripPasswords(d);
    return {data:d,oldProg:oldProg,oldIdx:oldIdx,tailCount:eo1.length-start,eo2Count:eo2.length};
  }

  function load(){
    if(!user)return;
    set('Sprawdzam dane…');
    ref=fs.collection('users').doc(user.uid).collection('data').doc('notatnik');
    ref.get().then(function(snap){
      if(!snap.exists)throw new Error('Nie znaleziono dokumentu notatnika w Firestore.');
      var raw=snap.data(); if(!raw.payload)throw new Error('Dokument nie zawiera pola payload.');
      payload=JSON.parse(raw.payload);
      var g3=(payload.groups||[]).filter(function(g){return g.code==='3Tb';})[0];
      set('Dane są gotowe.');
      migrate.classList.remove('hidden'); logout.classList.remove('hidden'); login.classList.add('hidden');
    }).catch(function(e){console.error(e);set('<span class="bad">Nie udało się wczytać danych.</span><br>Spróbuj ponownie.','bad');logout.classList.remove('hidden');login.classList.add('hidden');});
  }

  login.onclick=function(){var p=new firebase.auth.GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});auth.signInWithPopup(p).catch(function(e){set('<span class="bad">Nie udało się zalogować.</span><br>Spróbuj ponownie.','bad');});};
  logout.onclick=function(){auth.signOut();};
  migrate.onclick=function(){
    if(!payload||!ref)return;
    if(!confirm('Kontynuować?'))return;
    try{
      var clone=JSON.parse(JSON.stringify(payload));
      var result=buildMigration(clone);
      migrate.disabled=true; set('Zapisywanie…');
      var stamp=Date.now();
      ref.set({payload:JSON.stringify(result.data),updatedAt:firebase.firestore.FieldValue.serverTimestamp(),clientUpdatedAt:stamp,version:7},{merge:true}).then(function(){
        payload=result.data;
        set('<span class="ok">Gotowe.</span>','ok');
        migrate.classList.add('hidden');
      }).catch(function(e){migrate.disabled=false;console.error(e);set('<span class="bad">Nie udało się zapisać zmian.</span><br>Spróbuj ponownie.','bad');});
    }catch(e){console.error(e);set('<span class="bad">Nie udało się kontynuować.</span><br>Nic nie zostało zmienione.','bad');}
  };

  auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(function(){});
  auth.onAuthStateChanged(function(u){user=u||null;payload=null;ref=null;if(!u){status.className='box hidden';status.innerHTML='';login.classList.remove('hidden');migrate.classList.add('hidden');logout.classList.add('hidden');return;}load();});
})();
</script>
</body>
</html>
